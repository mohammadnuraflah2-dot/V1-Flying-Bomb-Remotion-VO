name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx remotion browser ensure

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render V1FlyingBomb out/v1-flying-bomb.mp4 --codec=h264

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: v1-flying-bomb
          path: out/v1-flying-bomb.mp4
          retention-days: 14
