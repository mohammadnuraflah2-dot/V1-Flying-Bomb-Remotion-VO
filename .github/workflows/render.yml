name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || true

      - run: npm install

      - name: Render
        run: npx remotion render V1FlyingBomb out/v1-flying-bomb.mp4 --codec=h264

      - uses: actions/upload-artifact@v4
        with:
          name: v1-flying-bomb
          path: out/v1-flying-bomb.mp4
          retention-days: 14
